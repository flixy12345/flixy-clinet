name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Find the project
        run: |
          if [ -f build.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            unzip -q auroramod-fabric-1.21.11.zip -d project
            DIR=$(dirname "$(find project -name build.gradle | head -n 1)")
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/build/libs/*.jar out/
          rm -f out/*-sources.jar

      - uses: actions/upload-artifact@v4
        with:
          name: auroramod-jar
          path: out/*.jar
